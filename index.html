<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>미지의 숲: 위치 기반 보호소 탐험기</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; }
    #map { width: 100%; height: 100%; }
    .controls {
      position: absolute; top: 15px; left: 50%; transform: translateX(-50%); z-index: 1000;
      display: flex; gap: 10px; background: rgba(255, 255, 255, 0.9); padding: 8px 15px;
      border-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    .btn {
      border: none; background: #2e7d32; color: white; padding: 8px 16px;
      border-radius: 15px; font-weight: bold; cursor: pointer; transition: background 0.2s;
    }
    .btn:hover { background: #1b5e20; }
  </style>
</head>
<body>

  <div class="controls">
    <button class="btn" onclick="moveToUserLocation()">📍 내 주변 지도</button>
    <button class="btn" onclick="moveToFullMap()">🗺️ 전체 지도</button>
  </div>

  <div id="map"></div>

  <script>
    // 💡 배포된 Apps Script의 새 웹 앱 URL을 붙여넣으세요.
    const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyF2ulyz9CReQ_4_I144Yn1Z1jp0cRufqt6B6fLpqsSceFv2d1rUsuQY_gpKNUdvBLAVA/exec";

    let map;
    let userMarker;
    let accuracyCircle;
    const KOREA_CENTER = [36.5, 127.8];
    let userCoords = { lat: 37.5665, lng: 126.9780 };

    window.onload = function() {
      map = L.map('map').setView(KOREA_CENTER, 7);

      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; OpenStreetMap'
      }).addTo(map);

      // GPS 추적 시작
      startGPSTracking();

      // 보호소 데이터 로드
      loadShelterData();
    };

    // 고정밀 지속적 GPS 실시간 추적 기능
    function startGPSTracking() {
      if ("geolocation" in navigator) {
        navigator.geolocation.watchPosition(
          (position) => {
            userCoords.lat = position.coords.latitude;
            userCoords.lng = position.coords.longitude;
            const accuracy = position.coords.accuracy; // 위치 오차 범위(m)

            // 기존 마커 및 오차 범위 원 제거
            if (userMarker) map.removeLayer(userMarker);
            if (accuracyCircle) map.removeLayer(accuracyCircle);

            // 1. 오차 범위 반경 표시 (연한 푸른색 원)
            accuracyCircle = L.circle([userCoords.lat, userCoords.lng], {
              radius: accuracy,
              color: '#1e88e5',
              fillColor: '#1e88e5',
              fillOpacity: 0.15,
              weight: 1
            }).addTo(map);

            // 2. 사용자 현재 위치 핀 마커
            userMarker = L.circleMarker([userCoords.lat, userCoords.lng], {
              radius: 8,
              fillColor: "#1e88e5",
              color: "#ffffff",
              weight: 3,
              opacity: 1,
              fillOpacity: 0.9
            }).addTo(map).bindPopup(`<b>📍 나의 위치</b><br>오차범위: 약 ${Math.round(accuracy)}m`);
          },
          (error) => {
            console.warn("GPS 수신 오류:", error);
          },
          {
            enableHighAccuracy: true, // 고정밀 GPS 사용
            timeout: 10000,
            maximumAge: 0
          }
        );
      } else {
        alert("이 브라우저는 GPS를 지원하지 않습니다.");
      }
    }

    function moveToUserLocation() {
      map.flyTo([userCoords.lat, userCoords.lng], 16, { animate: true, duration: 1.5 });
    }

    function moveToFullMap() {
      map.flyTo(KOREA_CENTER, 7, { animate: true, duration: 1.5 });
    }

    async function loadShelterData() {
      if (GAS_WEB_APP_URL.includes("여기에_APPS_SCRIPT")) {
        console.error("Apps Script URL을 확인해주세요.");
        return;
      }

      try {
        const response = await fetch(GAS_WEB_APP_URL);
        const resData = await response.json();

        if (resData.status === "success" && resData.data) {
          resData.data.forEach((shelter) => {
            // 백엔드에서 이미 좌표 변환을 마쳤으므로 바로 마커 찍기
            const marker = L.marker([shelter.lat, shelter.lng]).addTo(map);

            // 보호소 마커 클릭 이벤트
            marker.on('click', function() {
              alert(`🌲 미지의 숲에 접근했습니다!\n\n[보호소명]: ${shelter.name}\n[주소]: ${shelter.address}\n[전화번호]: ${shelter.tel}`);
            });
          });
        }
      } catch (err) {
        console.error("보호소 로딩 에러:", err);
      }
    }
  </script>
</body>
</html>
